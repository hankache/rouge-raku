name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: Ruby ${{ matrix.ruby }}, Rouge ${{ matrix.rouge }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', '3.1', '3.2', '3.3', '3.4']
        # the oldest version supported, the one GitHub Pages uses, the
        # last of the 4.x series, and the latest
        rouge: ['3.26.0', '3.30.0', '4.7.0', '']
    env:
      ROUGE_VERSION: ${{ matrix.rouge }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
